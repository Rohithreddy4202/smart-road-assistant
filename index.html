<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Smart Road Assistant</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial; }
    #map { height: 70vh; }
    #panel { padding: 10px; background: #f5f5f5; border-top: 1px solid #ccc; }
    #panel span { margin-right: 20px; }
    #destBox { width: 300px; padding: 5px; }
    #results button { width: 100%; padding: 8px; margin-bottom: 5px; text-align: left; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <input id="destBox" placeholder="Enter destination (address or lat,lon)" />
  <button onclick="setDestination()">Go</button>
  <br><br>
  <span><strong>Speed:</strong> <span id="speed">0</span> km/h</span>
  <span><strong>Speed limit:</strong> <span id="limit">50</span> km/h</span>
  <span id="status">Waiting for GPS...</span>
</div>

<div id="results" style="padding:10px;"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

  /* ------------------ CREATE MAP ------------------ */
  const map = L.map('map', { zoomSnap: 0.25 }).setView([46.31, -79.46], 14);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    minZoom: 3,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  /* ------------------ ICONS ------------------ */
  function makeIcon(url, size) {
    return L.icon({ iconUrl: url, iconSize: [size, size] });
  }

  let stopIcon = makeIcon("https://cdn-icons-png.flaticon.com/512/565/565547.png", 30);
  let allWayIcon = makeIcon("https://cdn-icons-png.flaticon.com/512/252/252025.png", 30);
  let signalIcon = makeIcon("https://cdn-icons-png.flaticon.com/512/483/483947.png", 30);

  let nodeLayer = L.layerGroup().addTo(map);

  /* ------------------ AUTO RESIZE ICONS ON ZOOM ------------------ */
  map.on("zoomend", () => {
    const z = map.getZoom();
    const size = z < 14 ? 20 : z < 17 ? 25 : 30;

    stopIcon = makeIcon(stopIcon.options.iconUrl, size);
    allWayIcon = makeIcon(allWayIcon.options.iconUrl, size);
    signalIcon = makeIcon(signalIcon.options.iconUrl, size);

    nodeLayer.eachLayer(layer => {
      const type = layer.options.type;
      if (type === "Stop") layer.setIcon(stopIcon);
      if (type === "All-way stop") layer.setIcon(allWayIcon);
      if (type === "Signal") layer.setIcon(signalIcon);
    });
  });

  /* ------------------ UI ELEMENTS ------------------ */
  const speedEl = document.getElementById('speed');
  const limitEl = document.getElementById('limit');
  const statusEl = document.getElementById('status');

  let speedLimit = 50;
  limitEl.textContent = speedLimit;

  const userMarker = L.circleMarker([0, 0], {
    radius: 8, color: 'blue', fillColor: 'blue', fillOpacity: 0.8
  }).addTo(map);

  let lastPos = null, lastTime = null;
  let currentLat = null, currentLon = null, currentHeading = null;
  let routeCoords = [], routePolyline = null, routeSteps = [], nextStepIndex = 0;
  let mapNodes = [], alerted = new Set();

  /* ------------------ SPEAK ------------------ */
  function speak(text) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.rate = 1.1;
    window.speechSynthesis.speak(msg);
  }

  /* ------------------ DISTANCE + BEARING ------------------ */
  function distance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function bearing(lat1, lon1, lat2, lon2) {
    const toRad = x => x * Math.PI / 180;
    const toDeg = x => x * 180 / Math.PI;
    const dLon = toRad(lon2 - lon1);
    const y = Math.sin(dLon) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
              Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function isIncoming(lat, lon) {
    if (!currentHeading) return true;
    const br = bearing(currentLat, currentLon, lat, lon);
    const diff = Math.abs(br - currentHeading);
    return diff < 45 || diff > 315;
  }

  function isOnRoute(lat, lon) {
    for (let i = 0; i < routeCoords.length; i++) {
      const d = distance(lat, lon, routeCoords[i][1], routeCoords[i][0]);
      if (d < 40) return true;
    }
    return false;
  }

  /* ------------------ GPS UPDATE ------------------ */
  function updateSpeed(pos) {
    const { latitude, longitude, heading } = pos.coords;
    const now = Date.now();
    currentLat = latitude; currentLon = longitude;
    currentHeading = heading || currentHeading;
    userMarker.setLatLng([latitude, longitude]);
    if (!routePolyline) map.setView([latitude, longitude], 15);
    map.panTo([latitude, longitude]);
    if (lastPos && lastTime) {
      const dist = distance(lastPos.latitude, lastPos.longitude, latitude, longitude);
      const timeSec = (now - lastTime) / 1000;
      const speedKmh = (dist / timeSec) * 3.6;
      speedEl.textContent = speedKmh.toFixed(1);
      if (speedKmh > speedLimit + 5) speak("You are exceeding the speed limit");
      checkTurns(); checkAlerts();
    }
    lastPos = { latitude, longitude }; lastTime = now;
  }

  /* ------------------ TURN ALERTS ------------------ */
  function checkTurns() {
    if (!routeSteps.length || nextStepIndex >= routeSteps.length) return;
    const step = routeSteps[nextStepIndex];
    const [lon, lat] = step.maneuver.location;
    const d = distance(currentLat, currentLon, lat, lon);
    if (d < 200 && !step._alert200) { speak(`In 200 meters, ${step.maneuver.instruction}`); step._alert200 = true; }
    if (d < 50 && !step._alert50) { speak(step.maneuver.instruction); step._alert50 = true; nextStepIndex++; }
  }

  /* ------------------ STOP + SIGNAL ALERTS ------------------ */
  function checkAlerts() {
    mapNodes.forEach(node => {
      if (!isOnRoute(node.lat, node.lon)) return;
      if (!isIncoming(node.lat, node.lon)) return;
      const d = distance(currentLat, currentLon, node.lat, node.lon);
      if (d < 200 && !alerted.has(node.id + "_200")) { speak(node.type + " ahead in 200 meters"); alerted.add(node.id + "_200"); }
      if (d < 100 && !alerted.has(node.id + "_100")) { speak(node.type + " ahead in 100 meters"); alerted.add(node.id + "_100"); }
    });
  }

  /* ------------------ ROUTE BOUNDING BOX ------------------ */
  function getBoundingBox(coords) {
    let minLat = 999, maxLat = -999, minLon = 999, maxLon = -999;
    coords.forEach(c => {
      const lon = c[0], lat = c[1];
      if (lat < minLat) minLat = lat;
      if (lat > maxLat) maxLat = lat;
      if (lon < minLon) minLon = lon;
      if (lon > maxLon) maxLon = lon;
    });
    const expand = 0.001;
    return {
      minLat: minLat - expand,
      maxLat: maxLat + expand,
      minLon: minLon - expand,
      maxLon: maxLon + expand
    };
  }

  /* ------------------ FETCH LATEST MAP DATA ------------------ */
  async function fetchLatestMapData() {
    if (routeCoords.length === 0) return;

    const box = getBoundingBox(routeCoords);

    const query = `
      [out:json];
      (
      (
  node["highway"="stop"](${box.minLat},${box.minLon},${box.maxLat},${box.maxLon});
  node["highway"="traffic_signals"](${box.minLat},${box.minLon},${box.maxLat},${box.maxLon});
);



      );
      out body;
    `;

    const res = await fetch("https://overpass.kumi.systems/api/interpreter", {
      method: "POST",
      body: query
    });

    const data = await res.json();

    nodeLayer.clearLayers();
    mapNodes = [];

    data.elements.forEach(el => {
      if (el.type === "node" && el.tags) {

        if (el.tags.highway === "stop") {
          const type = el.tags.stop === "all" ? "All-way stop" : "Stop";
          mapNodes.push({ id: el.id, lat: el.lat, lon: el.lon, type });

          const marker = L.marker([el.lat, el.lon], {
            icon: el.tags.stop === "all" ? allWayIcon : stopIcon,
            type
          });

          marker.addTo(nodeLayer);
        }

        if (el.tags.highway === "traffic_signals") {
          mapNodes.push({ id: el.id, lat: el.lat, lon: el.lon, type: "Signal" });

          const marker = L.marker([el.lat, el.lon], {
            icon: signalIcon,
            type: "Signal"
          });

          marker.addTo(nodeLayer);
        }
      }
    });
  }

  /* ------------------ ADDRESS SEARCH ------------------ */
  async function geocodeAddress(address) {
    const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=ca&addressdetails=1&q=${encodeURIComponent(address)}`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.length === 0) {
      alert("Address not found in Canada");
      return null;
    }

    data.forEach(item => {
      item._dist = distance(currentLat, currentLon, parseFloat(item.lat), parseFloat(item.lon));
    });

    data.sort((a, b) => a._dist - b._dist);

    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "<strong>Select correct address:</strong><br><br>";

    data.forEach(item => {
      const btn = document.createElement("button");
      btn.textContent = item.display_name;
      btn.onclick = () => {
        resultsDiv.innerHTML = "";
        startRoute(parseFloat(item.lat), parseFloat(item.lon));
      };
      resultsDiv.appendChild(btn);
    });

    return null;
  }

  /* ------------------ START ROUTE ------------------ */
  async function startRoute(dLat, dLon) {
    const url = `https://router.project-osrm.org/route/v1/driving/${currentLon},${currentLat};${dLon},${dLat}?overview=full&geometries=geojson&steps=true`;

    const res = await fetch(url);
    const data = await res.json();

    const route = data.routes[0];
    routeCoords = route.geometry.coordinates;
    routeSteps = route.legs[0].steps;
    nextStepIndex = 0;
    alerted.clear();

    if (routePolyline) map.removeLayer(routePolyline);
    routePolyline = L.polyline(routeCoords.map(c => [c[1], c[0]]), { color: "blue" }).addTo(map);

    speak("Route set. Navigation started.");

    fetchLatestMapData();
  }

  /* ------------------ SET DESTINATION ------------------ */
  async function setDestination() {
    const dest = document.getElementById("destBox").value.trim();

    if (dest.includes(",")) {
      const [dLat, dLon] = dest.split(",").map(Number);
      startRoute(dLat, dLon);
    } else {
      await geocodeAddress(dest);
    }
  }

  /* ------------------ START GPS ------------------ */
  navigator.geolocation.watchPosition(updateSpeed, err => {
    statusEl.textContent = "GPS error: " + err.message;
  }, { enableHighAccuracy: true });

  setInterval(fetchLatestMapData, 10000);

</script>

</body>
</html>
